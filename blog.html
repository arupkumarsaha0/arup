<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Coming Soon | Arup Kumar Saha</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS Animation Library CDN -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#040406',
                        cardBg: '#0e0f14',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #040406; color: #f3f4f6; overflow-x: hidden; }
        .bento-card {
            background: rgba(14, 15, 20, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s ease;
        }
        .blob-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(245, 158, 11, 0.08) 60%, transparent 100%);
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white min-h-screen flex flex-col justify-between relative">

    <div class="blob-glow top-1/4 left-1/2 -translate-x-1/2"></div>

    <div class="max-w-5xl mx-auto px-3 sm:px-6 pt-3 z-50 fixed inset-x-0 top-0 pointer-events-none">
        <nav class="bg-[#0e0f14]/95 border border-white/10 rounded-full px-4 sm:px-5 py-3 flex items-center justify-between shadow-xl pointer-events-auto" data-aos="fade-down" data-aos-duration="800">
            <a href="index.html" class="font-extrabold text-[11px] sm:text-xs tracking-wider bg-gradient-to-r from-blue-400 via-sky-300 to-amber-400 bg-clip-text text-transparent shrink-0">
                ARUP KUMAR SAHA
            </a>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] sm:text-[11px] font-bold px-4 py-1.5 rounded-full transition shadow-md flex items-center space-x-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Back to Home</span>
            </a>
        </nav>
    </div>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 my-auto text-center py-24 z-10" data-aos="zoom-in" data-aos-duration="800">
        <div class="bento-card p-8 sm:p-14 rounded-3xl space-y-6 shadow-2xl relative overflow-hidden border border-white/10">
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-blue-500/10 rounded-full blur-2xl pointer-events-none"></div>
            <div class="absolute -bottom-20 -left-20 w-40 h-40 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

            <div class="w-16 h-16 sm:w-20 sm:h-20 mx-auto rounded-2xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-2xl sm:text-3xl shadow-lg">
                <i class="fa-solid fa-blog"></i>
            </div>

            <div class="space-y-3">
                <span class="inline-block text-[10px] sm:text-[11px] font-bold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-3.5 py-1 rounded-full border border-blue-500/20">
                    Stay Tuned
                </span>
                <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white">
                    Blog Hub is Coming Soon
                </h1>
                <p class="text-xs sm:text-sm text-zinc-400 max-w-lg mx-auto leading-relaxed">
                    আইডিয়া, ম্যানেজমেন্ট ইনসাইটস এবং প্রফেশনাল রাইটিংস নিয়ে আমার ব্লগ সেকশনটি খুব শীঘ্রই উন্মুক্ত হতে যাচ্ছে। সাথে থাকুন!
                </p>
            </div>

            <div class="pt-2">
                <a href="index.html" class="inline-flex items-center space-x-2 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 hover:text-white font-bold px-6 py-3 rounded-xl text-xs border border-white/10 transition shadow-lg">
                    <i class="fa-solid fa-house"></i>
                    <span>Return to Homepage</span>
                </a>
            </div>
        </div>
    </main>

    <footer class="max-w-5xl mx-auto px-4 sm:px-6 py-6 border-t border-white/10 text-center text-xs text-zinc-500 z-10" data-aos="fade-in" data-aos-duration="600">
        <p>&copy; 2026 Arup Kumar Saha. All Rights Reserved.</p>
    </footer>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 20, duration: 700 });
    </script>
</body>
</html>
