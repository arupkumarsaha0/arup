<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Hub — Arup Kumar Saha</title>
    <!-- Favicon / Watermark Icon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100% দেবতাদের%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233b82f6%22/><text x=%2250%25%22 y=%2255%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-size=%2260%22 font-weight=%22bold%22 fill=%22%23ffffff%22>A</text></svg>">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- AOS Animation Library CDN -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#040406',
                        cardBg: '#0e0f14',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #040406; color: #f3f4f6; overflow-x: hidden; }
        .bento-card {
            background: rgba(14, 15, 20, 0.92);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.4s ease;
        }
        .blob-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, rgba(245, 158, 11, 0.08) 60%, transparent 100%);
            filter: blur(90px);
            border-radius: 50%;
            z-index: -1;
        }
    </style>
</head>
<body class="antialiased selection:bg-blue-500 selection:text-white min-h-screen flex flex-col justify-between relative">

    <div class="blob-glow top-1/4 left-1/2 -translate-x-1/2"></div>

    <div class="max-w-5xl mx-auto px-3 sm:px-6 pt-3 z-50 fixed inset-x-0 top-0 pointer-events-none">
        <nav class="bg-[#0e0f14]/95 border border-white/10 rounded-full px-4 sm:px-5 py-3 flex items-center justify-between shadow-xl pointer-events-auto" data-aos="fade-down" data-aos-duration="800">
            <a href="index.html" class="font-extrabold text-[11px] sm:text-xs tracking-wider bg-gradient-to-r from-blue-400 via-sky-300 to-amber-400 bg-clip-text text-transparent shrink-0">
                ARUP KUMAR SAHA
            </a>
            <a href="index.html" class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] sm:text-[11px] font-bold px-4 py-1.5 rounded-full transition shadow-md flex items-center space-x-1.5">
                <i class="fa-solid fa-arrow-left text-[10px]"></i>
                <span>Back to Home</span>
            </a>
        </nav>
    </div>

    <!-- MAIN BLOG CONTAINER (Dynamically Populated from blogs-data.js) -->
    <main class="max-w-4xl mx-auto px-4 sm:px-6 my-auto py-32 z-10 space-y-8" data-aos="fade-up" data-aos-duration="800">
        
        <div class="text-center space-y-2">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">My Blog Hub</h1>
            <p class="text-xs sm:text-sm text-zinc-400">Thoughts, insights, and professional writings on management and finance.</p>
        </div>

        <div id="blogPageContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Populated via JS -->
        </div>

        <div class="text-center pt-4">
            <a href="index.html" class="inline-flex items-center space-x-2 bg-zinc-900 hover:bg-zinc-800 text-zinc-200 hover:text-white font-bold px-6 py-3 rounded-xl text-xs border border-white/10 transition shadow-lg">
                <i class="fa-solid fa-house"></i>
                <span>Return to Homepage</span>
            </a>
        </div>
    </main>

    <footer class="max-w-5xl mx-auto px-4 sm:px-6 py-6 border-t border-white/10 text-center text-xs text-zinc-500 z-10">
        <p>&copy; 2026 Arup Kumar Saha. All Rights Reserved.</p>
    </footer>

    <!-- CENTRAL DATA SCRIPT -->
    <script src="blogs-data.js"></script>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ once: true, offset: 20, duration: 700 });

        const blogPageContainer = document.getElementById('blogPageContainer');
        if (siteData.isComingSoon) {
            blogPageContainer.innerHTML = `
                <div class="col-span-full bento-card p-10 rounded-3xl text-center space-y-4">
                    <div class="w-16 h-16 mx-auto rounded-2xl bg-blue-500/10 text-blue-400 border border-blue-500/20 flex items-center justify-center text-2xl shadow-lg">
                        <i class="fa-solid fa-blog"></i>
                    </div>
                    <span class="inline-block text-[10px] font-bold uppercase tracking-widest text-blue-400 bg-blue-500/10 px-3.5 py-1 rounded-full border border-blue-500/20">Stay Tuned</span>
                    <h3 class="text-xl font-bold text-white">Blog Hub is Coming Soon</h3>
                    <p class="text-xs sm:text-sm text-zinc-400 max-w-md mx-auto leading-relaxed">${siteData.comingSoonMessage}</p>
                </div>
            `;
        } else {
            let postsHTML = '';
            siteData.posts.forEach(post => {
                postsHTML += `
                    <div class="bento-card p-6 rounded-3xl space-y-3">
                        <div class="flex justify-between text-[11px] font-bold text-blue-400 uppercase tracking-widest">
                            <span>${post.category}</span>
                            <span>${post.date}</span>
                        </div>
                        <h3 class="font-bold text-base text-white">${post.title}</h3>
                        <p class="text-xs sm:text-sm text-zinc-400 leading-relaxed">${post.excerpt}</p>
                        <div class="pt-2">
                            <a href="#" class="text-xs text-blue-400 hover:text-blue-300 font-bold inline-flex items-center space-x-1.5">
                                <span>Read Full Post</span>
                                <i class="fa-solid fa-arrow-right text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                `;
            });
            blogPageContainer.innerHTML = postsHTML;
        }
    </script>
</body>
</html>
